<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>あさタクシー 営業先エリアマップ | 最新11月進捗連動</title>
    <meta name="description" content="あさタクシー営業先管理シート連動・11月最新進捗＆残り件数リアルタイム可視化マップ（スマートフォン対応）">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Control Bar -->
    <header id="header">
        <div class="header-top">
            <div class="brand">
                <span class="brand-icon">🚖</span>
                <div class="brand-text">
                    <h1>あさタクシー 営業先マップ</h1>
                    <span class="sub-text">2026年11月度 進捗管理連動版</span>
                </div>
            </div>
            <div class="header-stats" id="headerStats">
                <span class="stat-pill">全 <strong id="totalCount">0</strong></span>
                <span class="stat-pill visited" id="pillVisited" title="タップで11月訪問済のみ表示">済 <strong id="visitedCount">0</strong></span>
                <button type="button" class="stat-pill unvisited remain-highlight" id="pillRemaining" title="タップで残り（未接触）のみをマップ表示">
                    🔥 残りあと <strong id="unvisitedCount">0</strong> 件
                </button>
            </div>
        </div>

        <!-- Overall Progress Bar Row -->
        <div class="progress-overview-row">
            <div class="progress-label-group">
                <span class="progress-title">11月進捗率 <strong id="progressPercent">0%</strong></span>
                <span class="progress-sub" id="progressDetailText">完了 0件 / 残り 0件</span>
            </div>
            <div class="progress-track" title="11月営業進捗ゲージ">
                <div class="progress-fill" id="progressBarFill" style="width: 0%;"></div>
            </div>
            <button type="button" id="btnQuickRemaining" class="btn-quick-remain" title="残り（未接触）のみをマップにピン表示">
                ⚠️ 残りのみ表示
            </button>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="事業所名・病院名・住所・担当者で検索..." autocomplete="off">
            <button id="clearSearch" class="clear-btn" style="display:none;" aria-label="検索クリア">✕</button>
        </div>

        <!-- Filter Chips (Scrollable on Mobile) -->
        <div class="filter-bar">
            <!-- Status Filters (Placed first for quick access to Remaining) -->
            <div class="filter-group">
                <button class="chip status-chip active" data-filter="status" data-val="all">すべて表示</button>
                <button class="chip status-chip chip-unvisited" data-filter="status" data-val="未接触">🔥 残り未接触 (<span id="chipRemainCount">0</span>)</button>
                <button class="chip status-chip chip-visited" data-filter="status" data-val="訪問済">✔ 11月訪問済 (<span id="chipVisitedCount">0</span>)</button>
            </div>

            <div class="divider-v"></div>

            <!-- Category Filters -->
            <div class="filter-group">
                <button class="chip active" data-filter="category" data-val="all">全カテゴリ</button>
                <button class="chip cat-kyotaku" data-filter="category" data-val="居宅">居宅 <span class="badge" id="badgeKyotaku">0</span></button>
                <button class="chip cat-shisetsu" data-filter="category" data-val="施設">施設 <span class="badge" id="badgeShisetsu">0</span></button>
                <button class="chip cat-byoin" data-filter="category" data-val="病院">病院 <span class="badge" id="badgeByoin">0</span></button>
                <button class="chip cat-shogai" data-filter="category" data-val="障害・包括">障害・包括 <span class="badge" id="badgeShogai">0</span></button>
            </div>

            <div class="divider-v"></div>

            <!-- Distance Filters -->
            <div class="filter-group">
                <button class="chip dist-chip active" data-filter="distance" data-val="all">全距離</button>
                <button class="chip dist-chip" data-filter="distance" data-val="3">3km圏内 <span class="badge" id="badgeDist3">0</span></button>
                <button class="chip dist-chip" data-filter="distance" data-val="5">5km圏内 <span class="badge" id="badgeDist5">0</span></button>
                <button class="chip dist-chip" data-filter="distance" data-val="10">10km圏内 <span class="badge" id="badgeDist10">0</span></button>
            </div>
        </div>
    </header>

    <!-- Main Map Container -->
    <div id="map"></div>

    <!-- Map Overlay: Remaining Progress Card (Top-Left on Map) -->
    <div id="remainHud" class="remain-hud">
        <div class="remain-hud-header" id="remainHudToggle" title="タップで詳細を開閉">
            <div class="remain-hud-title">
                <span class="remain-dot"></span>
                <span>11月 残り営業先: <strong>あと <span id="hudRemainTotal">0</span> 件</strong></span>
            </div>
            <button type="button" class="remain-hud-toggle-btn" id="btnHudCollapse" aria-label="パネル開閉">▼</button>
        </div>
        <div class="remain-hud-body" id="remainHudBody">
            <div class="remain-hud-subtitle">カテゴリ別の残り件数（タップで未接触を絞込）</div>
            <div class="remain-cat-grid">
                <button type="button" class="remain-cat-item cat-border-kyotaku" data-cat="居宅">
                    <span class="rc-name">居宅</span>
                    <span class="rc-nums">残 <strong id="hudRemKyotaku">0</strong> <small>/ <span id="hudTotKyotaku">0</span></small></span>
                </button>
                <button type="button" class="remain-cat-item cat-border-shisetsu" data-cat="施設">
                    <span class="rc-name">施設</span>
                    <span class="rc-nums">残 <strong id="hudRemShisetsu">0</strong> <small>/ <span id="hudTotShisetsu">0</span></small></span>
                </button>
                <button type="button" class="remain-cat-item cat-border-byoin" data-cat="病院">
                    <span class="rc-name">病院</span>
                    <span class="rc-nums">残 <strong id="hudRemByoin">0</strong> <small>/ <span id="hudTotByoin">0</span></small></span>
                </button>
                <button type="button" class="remain-cat-item cat-border-shogai" data-cat="障害・包括">
                    <span class="rc-name">障害・包括</span>
                    <span class="rc-nums">残 <strong id="hudRemShogai">0</strong> <small>/ <span id="hudTotShogai">0</span></small></span>
                </button>
            </div>
            <div class="remain-dist-row">
                <span class="remain-dist-label">📍 距離圏別の残り:</span>
                <button type="button" class="remain-dist-pill" data-dist="3">3km圏 <strong>残<span id="hudRemDist3">0</span></strong></button>
                <button type="button" class="remain-dist-pill" data-dist="5">5km圏 <strong>残<span id="hudRemDist5">0</span></strong></button>
                <button type="button" class="remain-dist-pill" data-dist="10">10km圏 <strong>残<span id="hudRemDist10">0</span></strong></button>
            </div>
            <div class="remain-current-filter" id="hudCurrentFilterInfo">
                現在マップ表示中: 全 <strong id="hudVisibleTotal">0</strong> 件（うち残り <strong id="hudVisibleRemain">0</strong> 件）
            </div>
        </div>
    </div>

    <!-- Floating Action Buttons -->
    <div class="floating-controls">
        <button id="btnGps" class="fab-btn" title="現在地を表示 (GPS)">
            <span class="fab-icon">🎯</span>
            <span class="fab-label">現在地</span>
        </button>
        <button id="btnOffice" class="fab-btn" title="安東営業所へ移動">
            <span class="fab-icon">🏢</span>
            <span class="fab-label">営業所</span>
        </button>
        <button id="btnToggleList" class="fab-btn fab-primary" title="一覧リストを表示/非表示">
            <span class="fab-icon">📋</span>
            <span class="fab-label">リスト (<span id="listCount">0</span>)</span>
        </button>
    </div>

    <!-- Bottom List Drawer (Mobile Friendly) -->
    <div id="listDrawer" class="list-drawer">
        <div class="drawer-header" id="drawerHeader">
            <div class="drawer-handle"></div>
            <div class="drawer-title-row">
                <h3 class="drawer-title">絞り込み一覧 (<span id="drawerCount">0</span>件 / 残り<span id="drawerRemainCount">0</span>件)</h3>
                <div class="drawer-actions">
                    <select id="sortSelect" class="sort-select">
                        <option value="unvisited_first">残り（未接触）・近い順</option>
                        <option value="distance_asc">距離が近い順</option>
                        <option value="latest_desc">最新訪問日が新しい順</option>
                        <option value="name_asc">名称順</option>
                    </select>
                    <button id="btnCloseDrawer" class="drawer-close-btn" aria-label="閉じる">✕</button>
                </div>
            </div>
        </div>
        <div class="drawer-body" id="drawerList">
            <!-- Dynamic Cards generated by app.js -->
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <!-- Map Data -->
    <script src="data_all.js"></script>
    <!-- Custom Application Logic -->
    <script src="app.js"></script>
</body>
</html>
